name: Helm Chart CI

on:
  push:
    branches: [main]
    paths:
      - 'charts/employee-api/**'
  pull_request:
    branches: [main]
    paths:
      - 'charts/employee-api/**'

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Lint Chart
        run: helm lint charts/employee-api --strict

      - name: Render Templates
        run: helm template employee-api charts/employee-api --debug

      # Provision a lightweight Kubernetes cluster for testing
      - name: Set up Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster
          wait: 120s

      - name: Run Helm Tests
        env:
          # Reduce API request rate to prevent Kind cluster throttling
          HELM_KUBECTL_QPS: "10"
          HELM_KUBECTL_BURST: "20"
        run: |
          # Update dependencies first (e.g., PostgreSQL subchart)
          helm dependency update charts/employee-api
          
          # Install chart with PostgreSQL disabled for faster CI validation
          # Using nginx as placeholder image avoids private registry auth issues
          helm install test-release charts/employee-api \
            --namespace default \
            --create-namespace \
            --wait \
            --timeout 300s \
            --set-string image.repository="nginx" \
            --set-string image.tag="latest" \
            --set postgresql.enabled=false \
            --set database.url="postgresql://test:test@localhost:5432/testdb"
          
          # Run defined test hooks against the installed release
          helm test test-release --namespace default
          
          # Clean up test release regardless of outcome
          helm uninstall test-release --namespace default || true

  package-and-publish:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Chart
        run: |
          mkdir -p .dist
          helm package charts/employee-api \
            --app-version "${{ github.sha }}" \
            --destination .dist

      - name: Push Chart to GHCR
        run: |
          helm push .dist/employee-api-*.tgz oci://ghcr.io/${{ github.repository_owner }}/helm-charts