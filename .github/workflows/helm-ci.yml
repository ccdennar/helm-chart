name: Helm Chart CI

on:
  push:
    branches: [main]
    paths:
      - 'charts/employee-api/**'
  pull_request:
    branches: [main]
    paths:
      - 'charts/employee-api/**'

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Lint Chart
        run: helm lint charts/employee-api --strict

      - name: Render Templates
        run: helm template employee-api charts/employee-api --debug

      - name: Create Kind cluster config
        run: |
          cat > /tmp/kind-config.yaml << 'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: ClusterConfiguration
              apiServer:
                extraArgs:
                  max-mutating-requests-inflight: "400"
                  max-requests-inflight: "600"
          EOF

      - name: Set up Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster
          wait: 120s
          config: /tmp/kind-config.yaml

      - name: Run Helm Tests
        run: |
          set +e  # ✅ Disable exit-on-error so we can handle failures manually
          
          helm dependency update charts/employee-api
          
          kubectl create namespace default --dry-run=client -o yaml | kubectl apply -f - 2>/dev/null || true
          
          # ✅ Removed --history-max (not available in Helm v3.14.0)
          # ✅ Kept --atomic removed to prevent rollback API storms
          helm install test-release charts/employee-api \
            --namespace default \
            --wait \
            --timeout 600s \
            --set-string image.repository="nginx" \
            --set-string image.tag="latest" \
            --set postgresql.enabled=false \
            --set database.url="postgresql://test:test@localhost:5432/testdb" \
            --set replicaCount=1
          
          INSTALL_EXIT=$?
          
          if [ $INSTALL_EXIT -eq 0 ]; then
            helm test test-release --namespace default
            TEST_EXIT=$?
          else
            TEST_EXIT=1
          fi
          
          # Always clean up regardless of outcome
          helm uninstall test-release --namespace default || true
          
          set -e  # Re-enable strict mode
          
          # Fail the step if either install or test failed
          if [ $INSTALL_EXIT -ne 0 ]; then
            echo "::error::Helm install failed with exit code $INSTALL_EXIT"
            exit $INSTALL_EXIT
          elif [ $TEST_EXIT -ne 0 ]; then
            echo "::error::Helm test failed with exit code $TEST_EXIT"
            exit $TEST_EXIT
          fi

  package-and-publish:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Chart
        run: |
          mkdir -p .dist
          helm package charts/employee-api \
            --app-version "${{ github.sha }}" \
            --destination .dist

      - name: Push Chart to GHCR
        run: |
          helm push .dist/employee-api-*.tgz oci://ghcr.io/${{ github.repository_owner }}/helm-charts