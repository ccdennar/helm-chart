name: Helm Chart CI

on:
  push:
    branches: [main]
    paths:
      - 'charts/employee-api/**'
  pull_request:
    branches: [main]
    paths:
      - 'charts/employee-api/**'

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Lint Chart
        run: helm lint charts/employee-api --strict

      - name: Render Templates
        run: helm template employee-api charts/employee-api --debug

      # Provision Kind cluster with tuned API server limits
      - name: Set up Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster
          wait: 120s
          # ✅ CRITICAL FIX: Use literal block scalar for inline config
          config: |
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            nodes:
            - role: control-plane
              kubeadmConfigPatches:
              - |
                kind: ClusterConfiguration
                apiServer:
                  extraArgs:
                    max-mutating-requests-inflight: "400"
                    max-requests-inflight: "600"

      - name: Run Helm Tests
        run: |
          helm dependency update charts/employee-api
          
          # Pre-create namespace to reduce API calls during install
          kubectl create namespace default --dry-run=client -o yaml | kubectl apply -f -
          
          # Install with minimal footprint; nginx avoids private registry auth
          helm install test-release charts/employee-api \
            --namespace default \
            --wait \
            --timeout 300s \
            --set-string image.repository="nginx" \
            --set-string image.tag="latest" \
            --set postgresql.enabled=false \
            --set database.url="postgresql://test:test@localhost:5432/testdb" \
            --atomic
          
          helm test test-release --namespace default
          helm uninstall test-release --namespace default || true

  package-and-publish:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Chart
        run: |
          mkdir -p .dist
          helm package charts/employee-api \
            --app-version "${{ github.sha }}" \
            --destination .dist

      - name: Push Chart to GHCR
        run: |
          helm push .dist/employee-api-*.tgz oci://ghcr.io/${{ github.repository_owner }}/helm-charts