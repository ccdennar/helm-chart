name: Helm Chart CI

on:
  push:
    branches: [main]
    paths:
      - 'charts/employee-api/**'
  pull_request:
    branches: [main]
    paths:
      - 'charts/employee-api/**'

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Lint Chart
        run: helm lint charts/employee-api --strict

      - name: Render Templates
        run: |
          # Validate templates render correctly with CI values
          # This catches syntax errors, missing values, and invalid K8s manifests
          # WITHOUT creating any cluster resources (zero API calls)
          helm template test-release charts/employee-api \
            --namespace default \
            --set-string image.repository="nginx" \
            --set-string image.tag="latest" \
            --set postgresql.enabled=false \
            --set database.url="postgresql://test:test@localhost:5432/testdb" \
            --debug > /dev/null

      - name: Validate Manifest Structure
        run: |
          # Count rendered resources to ensure no unexpected objects
          RESOURCE_COUNT=$(helm template test-release charts/employee-api \
            --namespace default \
            --set-string image.repository="nginx" \
            --set-string image.tag="latest" \
            --set postgresql.enabled=false \
            --set database.url="postgresql://test:test@localhost:5432/testdb" \
            | grep -c "^---")
          
          echo "Rendered $RESOURCE_COUNT Kubernetes resources"
          
          # Fail if too many resources (indicates conditionals not working)
          if [ "$RESOURCE_COUNT" -gt 5 ]; then
            echo "::warning::Chart renders $RESOURCE_COUNT resources in CI."
            echo "Add {{- if .Values.xxx.enabled }} guards to NetworkPolicy, HPA, and test templates"
            echo "to reduce CI API load. Current count exceeds safe threshold of 5."
          fi

  package-and-publish:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Chart
        run: |
          mkdir -p .dist
          helm package charts/employee-api \
            --app-version "${{ github.sha }}" \
            --destination .dist

      - name: Push Chart to GHCR
        run: |
          helm push .dist/employee-api-*.tgz oci://ghcr.io/${{ github.repository_owner }}/helm-charts