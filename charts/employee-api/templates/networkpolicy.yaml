apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "employee-api.fullname" . }}-deny-all
  labels:
    {{- include "employee-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "employee-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5432