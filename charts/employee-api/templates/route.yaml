{{- /*
  OpenShift Route: rendered only when explicitly enabled AND the cluster
  serves route.openshift.io/v1. On minikube/vCluster this renders nothing.
*/ -}}
{{- if and .Values.route.enabled (.Capabilities.APIVersions.Has "route.openshift.io/v1") }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "employee-api.fullname" . }}
  labels:
    {{- include "employee-api.labels" . | nindent 4 }}
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "employee-api.fullname" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}