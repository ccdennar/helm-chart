replicaCount: 2

image:
  repository: ghcr.io/ccdennar/employee-management-app/employee-api
  pullPolicy: IfNotPresent
  tag: ""  # Set by CI via --set-string image.tag=$SHA

# Needed only if the GHCR image is private, e.g.
#   imagePullSecrets:
#     - name: ghcr-pull
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000   # port the app listens on; also used as the container port

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

config:
  databaseUrl: ""  # Injected via Secret in production
  logLevel: "info"

# Credentials used by templates/deployment.yaml to build DATABASE_URL.
# Staging defaults only - override with real values outside this file.
secret:
  dbUser: postgres
  dbPassword: postgres
  dbName: employee_db

# Without a readiness probe a pod is "Ready" the moment the container starts,
# before uvicorn is listening (the app creates tables at import time). That is
# what made the smoke tests hit "connection refused".
readinessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  name: ""  # Leave empty to use fullname template
  annotations: {}

# OpenShift-specific configuration.
# MUST stay false on minikube/vCluster: the Route kind only exists on OpenShift.
route:
  enabled: false
  host: "employee-api.example.com"

podAnnotations: {}
podLabels: {}

# SCC-compliant pod security context.
# 10001 matches the non-root user created in the Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# NOTE: templates/deployment.yaml reads `.Values.securityContext` (this key).
# It was previously named `containerSecurityContext`, which the template
# ignores, so the container-level settings were never applied.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# readOnlyRootFilesystem needs a writable /tmp
volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}
tolerations: []
affinity: {}